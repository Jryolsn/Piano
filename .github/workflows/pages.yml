name: Pages

# One site: main at /<repo>/, dev at /<repo>/dev/.
# Dev updates arrive via workflow_run, which runs on the default branch and so
# passes the github-pages environment's branch rule.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Build main
        working-directory: main
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ env.REPO }}/
      - name: Build dev
        working-directory: dev
        run: npm ci && npm run build
        env:
          BASE_PATH: /${{ env.REPO }}/dev/
      - run: |
          mkdir site
          cp -r main/dist/. site/
          cp -r dev/dist site/dev
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
