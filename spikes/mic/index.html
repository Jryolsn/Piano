<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mic spike</title>
    <style>
      body { margin: 0; padding: 16px; font: 16px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
      button { font-size: 18px; padding: 12px 20px; }
      #notes { font-size: 40px; font-weight: 600; min-height: 56px; margin: 12px 0; }
      #level { height: 12px; background: #333; } #level > div { height: 100%; width: 0; background: #4caf50; }
      select { font-size: 16px; padding: 8px; max-width: 100%; }
      canvas { width: 100%; height: 200px; background: #000; display: block; margin: 12px 0; }
      table { border-collapse: collapse; font-size: 14px; } td { padding: 2px 12px 2px 0; }
      .bad { color: #ff6b6b; } .good { color: #6bdc7a; }
    </style>
  </head>
  <body>
    <h1>Mic spike</h1>
    <button id="start">Start microphone</button>
    <div id="notes"></div>
    <div id="level"><div></div></div>
    <canvas id="spectrum"></canvas>
    <section id="record" hidden>
      <h2>Record</h2>
      <p>Select a take, press Record, play, press Stop. The WAV file downloads automatically.</p>
      <select id="take"></select>
      <p id="instruction"></p>
      <button id="rec">Record</button>
      <button id="report">Download report</button>
      <p id="recstatus"></p>
    </section>
    <table id="info"></table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
