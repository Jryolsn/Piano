<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mic spike</title>
    <style>
      body { margin: 0; padding: 16px; font: 16px/1.4 system-ui, sans-serif; background: #111; color: #eee; }
      button { font-size: 18px; padding: 12px 20px; }
      #notes { font-size: 40px; font-weight: 600; min-height: 56px; margin: 12px 0; }
      #level { height: 12px; background: #333; } #level > div { height: 100%; width: 0; background: #4caf50; }
      select { font-size: 16px; padding: 8px; max-width: 100%; }
      .hint { margin: 8px 0 4px; font-size: 14px; color: #aaa; } ol { padding-left: 20px; } li { margin: 6px 0; }
      #kbd-full svg { max-height: 40px; } #kbd-zoom svg { max-height: 120px; }
      canvas { width: 100%; height: 200px; background: #000; display: block; margin: 12px 0; }
      table { border-collapse: collapse; font-size: 14px; } td { padding: 2px 12px 2px 0; }
      .bad { color: #ff6b6b; } .good { color: #6bdc7a; }
    </style>
  </head>
  <body>
    <h1>Mic spike</h1>
    <button id="start">Starta mikrofonen</button>
    <div id="notes"></div>
    <div id="level"><div></div></div>
    <canvas id="spectrum"></canvas>
    <section id="record" hidden>
      <h2>Inspelning</h2>
      <select id="take"></select>
      <h3 id="title"></h3>
      <ol id="steps"></ol>
      <p class="hint">Hela pianot (gult = tryck här):</p>
      <div id="kbd-full"></div>
      <p class="hint">Inzoomat:</p>
      <div id="kbd-zoom"></div>
      <p><button id="rec">Spela in</button> <button id="report">Ladda ner rapport</button></p>
      <p id="recstatus"></p>
    </section>
    <table id="info"></table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
